<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JADARA - Administrador</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fbf7f5; color: #4a3b32; padding: 40px 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #b57c7c; text-align: center; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        label { display: block; margin-top: 15px; font-weight: 600; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #f0e6e1; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; background-color: #b57c7c; color: white; border: none; padding: 14px; border-radius: 25px; font-weight: bold; margin-top: 25px; cursor: pointer; transition: background 0.3s; font-size: 1rem; }
        button:hover { background-color: #9e6464; }
        .btn-cerrar { background-color: #7a685d; margin-top: 10px; }
        .btn-cerrar:hover { background-color: #5c4e46; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Panel JADARA</h2>
        <p style="text-align: center; color: #8c7365; font-size: 0.9rem; margin-bottom: 20px;">Agregar nuevo producto al catálogo</p>
        
        <form id="form-producto">
            <label>Nombre del Producto:</label>
            <input type="text" id="nombre" placeholder="Ej: Nike Shox TL" required>

            <label>Categoría:</label>
            <select id="categoria" required>
                <option value="calzado">Calzado</option>
                <option value="belleza">Belleza</option>
            </select>

            <label>Descripción:</label>
            <textarea id="descripcion" rows="3" placeholder="Detalles, tallas disponibles, colores..." required></textarea>

            <label>Precio:</label>
            <input type="text" id="precio" placeholder="Ej: $170.000 COP" required>

            <label>Nombre del archivo de imagen:</label>
            <input type="text" id="imagen" placeholder="Ej: nikeshoxtl.png" required>

            <button type="submit">Publicar en el Catálogo</button>
            <button type="button" class="btn-cerrar" id="btn-logout">Cerrar Sesión</button>
        </form>
    </div>

    <!-- MÓDULOS DE FIREBASE PROTEGIDOS -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, collection, addDoc } from "https://gstatic.com";
        import { getAuth, onAuthStateChanged, signOut } from "https://gstatic.com";

        // Tus credenciales oficiales de JADARA
        const firebaseConfig = {
            apiKey: "AIzaSyA-0kfqwKNCZmhH26kqALHuHmkkpp8B56U",
            authDomain: "://firebaseapp.com",
            projectId: "jadara-6628b",
            storageBucket: "jadara-6628b.firebasestorage.app",
            messagingSenderId: "76447900274",
            appId: "1:76447900274:web:6ebb6cd0c4650223e018eb",
            measurementId: "G-7XKD4TE3YC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // GUARDIÁN DE SEGURIDAD: Si no estás logueado, te expulsa al login de inmediato
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            }
        });

        // Guardar producto en la base de datos al enviar el formulario
        document.getElementById('form-producto').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nuevoProducto = {
                nombre: document.getElementById('nombre').value,
                categoria: document.getElementById('categoria').value,
                descripcion: document.getElementById('descripcion').value,
                precio: document.getElementById('precio').value,
                imagen: document.getElementById('imagen').value,
                fechaCreacion: new Date()
            };

            try {
                await addDoc(collection(db, "productos"), nuevoProducto);
                alert("¡Producto guardado con éxito!");
                document.getElementById('form-producto').reset();
            } catch (error) {
                console.error("Error al guardar: ", error);
                alert("Hubo un error al guardar el producto.");
            }
        });

        // Función para el botón de cerrar sesión
        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            });
        });
    </script>
</body>
</html>
